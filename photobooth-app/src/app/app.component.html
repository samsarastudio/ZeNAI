<div class="pb-shell">
  <div class="pb-backdrop" aria-hidden="true">
    <!-- Paper theme: photobooth / social doodle clusters (Font Awesome) -->
    <div class="pb-doodle pb-doodle-paper">
      <div class="pb-doodle-cluster pb-doodle-cluster--a">
        <i class="fa-solid fa-camera"></i>
        <i class="fa-solid fa-images"></i>
        <i class="fa-solid fa-film"></i>
        <i class="fa-solid fa-clapperboard"></i>
        <i class="fa-solid fa-print"></i>
        <i class="fa-solid fa-face-smile"></i>
        <i class="fa-solid fa-heart"></i>
      </div>
      <div class="pb-doodle-cluster pb-doodle-cluster--b">
        <i class="fa-solid fa-image"></i>
        <i class="fa-solid fa-wand-magic-sparkles"></i>
        <i class="fa-solid fa-star"></i>
        <i class="fa-solid fa-palette"></i>
        <i class="fa-solid fa-eye"></i>
        <i class="fa-solid fa-mobile-screen"></i>
        <i class="fa-solid fa-paper-plane"></i>
      </div>
    </div>

    <!-- Circuit theme: EV / tech doodle clusters -->
    <div class="pb-doodle pb-doodle-circuit">
      <div class="pb-doodle-cluster pb-doodle-cluster--a">
        <i class="fa-solid fa-car-side"></i>
        <i class="fa-solid fa-road"></i>
        <i class="fa-solid fa-bolt"></i>
        <i class="fa-solid fa-battery-full"></i>
        <i class="fa-solid fa-charging-station"></i>
        <i class="fa-solid fa-plug"></i>
      </div>
      <div class="pb-doodle-cluster pb-doodle-cluster--b">
        <i class="fa-solid fa-gauge-high"></i>
        <i class="fa-solid fa-microchip"></i>
        <i class="fa-solid fa-satellite-dish"></i>
        <i class="fa-solid fa-gears"></i>
        <i class="fa-solid fa-fan"></i>
        <i class="fa-solid fa-network-wired"></i>
      </div>
    </div>

    <!-- Light ambient wash (theme CSS controls visibility) -->
    <div class="pb-backdrop-wash"></div>

    <!-- Circuit theme: LED / trace accents (geometric, GPU-cheap) -->
    <div class="pb-backdrop-el pb-backdrop-el--1"></div>
    <div class="pb-backdrop-el pb-backdrop-el--2"></div>
    <div class="pb-backdrop-el pb-backdrop-el--3"></div>
    <div class="pb-backdrop-el pb-backdrop-el--4"></div>
  </div>
  <router-outlet />
  <pb-debug-log-dock />
</div>
