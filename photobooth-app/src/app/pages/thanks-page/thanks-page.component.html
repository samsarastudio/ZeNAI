<div class="pb-page pb-thanks pb-zyn-thanks-page">
  <div class="pb-zyn-thanks">
    <img class="pb-zyn-logo" src="zyn/logo.svg" alt="ZYN" />

    <div class="pb-zyn-thanks-card" [class.is-error]="!!guestStatusHint()">
      @if (guestStatusHint(); as hint) {
        <div class="pb-zyn-thanks-warn" aria-hidden="true">!</div>
        <h2 class="pb-zyn-thanks-title">{{ headline() }}</h2>
        <p class="pb-zyn-thanks-hint">{{ hint }}</p>
      } @else {
        <h2 class="pb-zyn-thanks-title">{{ headline() }}</h2>
      }
    </div>

    <div class="pb-zyn-thanks-actions">
      <button type="button" class="pb-btn pb-btn-primary" (click)="startOver()">
        {{ copy().thanks.startOver }}
      </button>
    </div>
  </div>
</div>
