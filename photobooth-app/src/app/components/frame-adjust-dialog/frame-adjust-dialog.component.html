<div class="pb-pf-overlay" role="dialog" aria-modal="true" [attr.aria-labelledby]="'pb-fa-title'">
  <div class="pb-pf-card">
    <h2 id="pb-fa-title">{{ copy().frameAdjust.title }}</h2>
    <p class="pb-pf-hint">{{ copy().frameAdjust.hint }}</p>

    <div class="pb-pf-stage">
      <canvas
        #sheetCanvas
        class="pb-pf-canvas"
        (pointerdown)="onPointerDown($event)"
        (pointermove)="onPointerMove($event)"
        (pointerup)="onPointerUp($event)"
        (pointercancel)="onPointerUp($event)"
      ></canvas>
      @if (!ready() && !err()) {
        <p class="pb-pf-loading">{{ copy().result.loading }}</p>
      }
    </div>

    @if (err(); as e) {
      <p class="pb-msg">{{ e }}</p>
    }

    <div class="pb-pf-zoom" role="group" [attr.aria-label]="copy().frameAdjust.zoomLabel">
      <button type="button" class="pb-btn pb-btn-ghost pb-pf-zoom-btn" [disabled]="busy() || zoom() <= 1" (click)="zoomBy(-0.15)">
        −
      </button>
      <input
        class="pb-pf-zoom-range"
        type="range"
        min="1"
        max="3"
        step="0.05"
        [value]="zoom()"
        [disabled]="busy()"
        (input)="onZoomInput($event)"
      />
      <button type="button" class="pb-btn pb-btn-ghost pb-pf-zoom-btn" [disabled]="busy() || zoom() >= 4" (click)="zoomBy(0.15)">
        +
      </button>
      <span class="pb-pf-zoom-val">{{ zoom().toFixed(2) }}×</span>
    </div>

    <div class="pb-row pb-pf-actions">
      <button type="button" class="pb-btn pb-btn-ghost" [disabled]="busy()" (click)="cancel()">
        {{ copy().frameAdjust.cancel }}
      </button>
      <button type="button" class="pb-btn pb-btn-primary" [disabled]="busy() || !ready()" (click)="confirm()">
        @if (busy()) {
          {{ copy().frame.applying }}
        } @else {
          {{ confirmLabel() || copy().frameAdjust.confirm }}
        }
      </button>
    </div>
  </div>
</div>
