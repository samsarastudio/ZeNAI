<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ZYN Gallery</title>
    <style>
      html, body { margin: 0; background: #0b1f18; color: #f4f7f5; font-family: system-ui, sans-serif; }
      header { padding: 1.2rem 1.5rem; }
      .eyebrow { letter-spacing: 0.14em; text-transform: uppercase; color: #c8e87a; font-size: 0.75rem; margin: 0; }
      h1 { margin: 0.2rem 0 0; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 0.8rem; padding: 0 1.5rem 2rem; }
      img { width: 100%; aspect-ratio: 3/2; object-fit: cover; border-radius: 12px; background: #123528; display: block; }
      .empty { padding: 2rem 1.5rem; opacity: 0.7; }
    </style>
  </head>
  <body>
    <header>
      <p class="eyebrow">ZYN Photobooth</p>
      <h1>Cloud gallery</h1>
    </header>
    <div id="grid" class="grid"></div>
    <script src="/gallery.js"></script>
  </body>
</html>
